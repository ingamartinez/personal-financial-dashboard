version: 2
updates:
  # Bun project: the `npm` ecosystem updates package.json but never bun.lock,
  # and ci.yml installs with `bun install --frozen-lockfile` — so every PR it
  # opened arrived red (#889). `bun` regenerates the lockfile alongside.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - infra
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - infra
