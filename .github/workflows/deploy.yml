name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (defaults to main)"
        required: false
        default: "main"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}
      APP_ROOT: /srv/findash

    steps:
      - name: Resolve target ref
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 1

      - name: Resolve SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone artifact
        env:
          # Build-time stubs only. Real secrets live on the droplet in
          # /srv/findash/env/findash.env and are read by systemd at process start.
          AUTH_SECRET: build-dummy-never-used-in-prod
          BOOTSTRAP_USER_EMAIL: build@findash.local
          BOOTSTRAP_USER_NAME: Build Bootstrap
          # Required by src/lib/crypto/symmetric.ts at module-load time —
          # Next.js page-data collection imports the webhook route. 32 zero
          # bytes base64. Real key lives on the droplet in findash.env.
          TELEGRAM_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          # Same pattern for Gmail integration (Epic G — #459).
          GMAIL_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          # OAuth callback URL — build-time stub. Real value set per-environment
          # in findash.env (prod: https://findash.alejoframes.com/...).
          GMAIL_OAUTH_REDIRECT_URI: https://build.findash.local/api/integrations/gmail/oauth/callback
          # BullMQ queue backend — build-time stub. Real Redis URL lives in
          # /srv/findash/env/findash.env on the droplet (see docs/deploy.md §13).
          REDIS_URL: redis://localhost:6379
        run: bun run build

      - name: Package release tarball
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          STAGE=release-stage
          mkdir -p "$STAGE"
          cp -r .next/standalone/. "$STAGE"/
          mkdir -p "$STAGE/.next"
          cp -r .next/static "$STAGE/.next/static"
          if [ -d public ]; then cp -r public "$STAGE/public"; fi
          # drizzle-orm/postgres-js/migrator isn't traced by Next's standalone
          # output (no app code imports it), so overlay the full drizzle-orm
          # and postgres packages. Tarball stays well under 50 MB.
          cp -r node_modules/drizzle-orm "$STAGE/node_modules/drizzle-orm"
          cp -r node_modules/postgres "$STAGE/node_modules/postgres"
          cp -r drizzle "$STAGE/drizzle"
          # Overlay migrate-prod + backfill scripts under scripts/ preserving
          # dev layout so their relative `../src/...` imports resolve the same
          # way on prod as in local runs.
          mkdir -p "$STAGE/scripts" "$STAGE/src/lib/db" "$STAGE/src/lib/auth"
          cp scripts/migrate-prod.ts "$STAGE/scripts/migrate-prod.ts"
          cp scripts/backfill-users-reference.ts "$STAGE/scripts/backfill-users-reference.ts"
          # #405: migrate-prod also calls the pago-tc → transfer-group backfill.
          cp scripts/migrate-pago-tc-to-transfer.ts "$STAGE/scripts/migrate-pago-tc-to-transfer.ts"
          # #766 hotfix: ATM channel backfill runs as a separate post-migrate step.
          # Data backfills that depend on a newly-added enum value cannot run in the
          # same drizzle batch as the ALTER TYPE — Postgres rejects "unsafe use of
          # new value" in the same transaction. See scripts/backfill-atm-channel.ts.
          cp scripts/backfill-atm-channel.ts "$STAGE/scripts/backfill-atm-channel.ts"
          # migrate-prod imports these for reference-data seeding + per-user
          # backfill; they live under src/ and are NOT traced by Next
          # standalone, so overlay them explicitly.
          cp src/lib/db/index.ts "$STAGE/src/lib/db/index.ts"
          cp src/lib/db/schema.ts "$STAGE/src/lib/db/schema.ts"
          cp src/lib/db/seed-reference-data.ts "$STAGE/src/lib/db/seed-reference-data.ts"
          # #538: migrate-prod now calls seedUserAliases — overlay the module.
          cp src/lib/db/seed-user-aliases.ts "$STAGE/src/lib/db/seed-user-aliases.ts"
          cp src/lib/auth/signup.ts "$STAGE/src/lib/auth/signup.ts"
          cp src/lib/logger.ts "$STAGE/src/lib/logger.ts"
          echo "$GIT_SHA" > "$STAGE/GIT_SHA"
          tar -czf release.tar.gz -C "$STAGE" .
          ls -lh release.tar.gz

      - name: Setup SSH
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Provision Redis (idempotent)
        # Every BullMQ worker registered at boot (fx-refresh, classify-tx,
        # gmail-pull, etc — see src/instrumentation.node.ts) needs Redis up
        # before findash.service starts. This step ensures the droplet has
        # redis-server installed and our hardened unit at /etc/systemd/system/
        # redis.service. Idempotent: a healthy droplet hits the no-op path.
        run: |
          set -eu
          # #795: stage in /home/deploy/staging (0700, under deploy's
          # 0750-with-empty-group home), NOT /tmp. /tmp is world-writable and
          # this droplet has other local principals with a real /tmp view
          # outside any PrivateTmp sandbox (the cron backup jobs run as
          # findash/photoshowcase/zyeth — cron does not apply PrivateTmp=),
          # any of which could have pre-created the staged path and rewritten
          # it before the privileged install. See
          # infra/sudoers/findash-redis-provision for the full write-up.
          #
          # The path is spelled out literally rather than derived from $HOME
          # because sudo matches the rule against the expanded argv — it has
          # to be character-identical to the path pinned in the sudoers file.
          # The rule names `deploy` specifically, so a DEPLOY_USER whose home
          # is not /home/deploy fails closed at the sudo call instead of
          # silently installing from an unpinned path.
          STAGED=/home/deploy/staging/redis-findash.service
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" 'install -d -m 0700 /home/deploy/staging'
          scp -i ~/.ssh/deploy_key \
            infra/systemd/redis.service "$DEPLOY_USER@$DEPLOY_HOST:$STAGED"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            STAGED=/home/deploy/staging/redis-findash.service
            # Install redis-server package only if missing. -y -qq is enough
            # for the no-interaction case (no debconf prompts on this package);
            # passing DEBIAN_FRONTEND through sudo would require an env_keep
            # entry the deploy user does not have, and would fail on a fresh
            # droplet (#605).
            if ! command -v redis-server >/dev/null 2>&1; then
              echo "installing redis-server..."
              sudo -n apt-get update -qq
              sudo -n apt-get install -y -qq redis-server
            fi
            # Disable the Ubuntu default unit if it ever became enabled.
            sudo -n systemctl disable --now redis-server.service 2>/dev/null || true
            # Replace our unit only if the on-disk copy differs from the repo.
            # Avoids gratuitous redis restarts on every deploy.
            # /etc/systemd/system/redis.service is 0644 root:root, so this
            # comparison needs no sudo grant at all (#795). `install` — not
            # `mv` — states mode and ownership explicitly instead of
            # inheriting them from the staged inode.
            if ! cmp -s "$STAGED" /etc/systemd/system/redis.service; then
              echo "redis unit changed — installing"
              sudo -n install -m 0644 -o root -g root "$STAGED" /etc/systemd/system/redis.service
              sudo -n systemctl daemon-reload
              sudo -n systemctl enable redis.service
              sudo -n systemctl restart redis.service
            fi
            rm -f "$STAGED"
            # Ensure active (covers fresh-install case + crash recovery).
            sudo -n systemctl is-active --quiet redis.service || sudo -n systemctl start redis.service
            # Verify reachable.
            redis-cli ping
          '

      - name: Upload tarball
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/release-$GIT_SHA.tar.gz"

      - name: Extract release + write release.env
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          TARBALL="/tmp/release-$GIT_SHA.tar.gz"
          # release.env lives INSIDE the release dir so it moves with the
          # symlink (systemd EnvironmentFile follows /srv/findash/app/current).
          # Findash owns the release dir — no cross-group perm juggling.
          ENV_FILE="$RELEASE_DIR/release.env"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            sudo -n -u findash install -d -m 0755 '$RELEASE_DIR'
            sudo -n -u findash tar -xzf '$TARBALL' -C '$RELEASE_DIR'
            rm -f '$TARBALL'
            printf 'GIT_SHA=%s\n' '$GIT_SHA' | sudo -n -u findash tee '$ENV_FILE' >/dev/null
            sudo -n -u findash chmod 0640 '$ENV_FILE'
          "

      - name: Run migrations
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$RELEASE_DIR'
            sudo -n -u findash /usr/local/bin/bun scripts/migrate-prod.ts
          "

      # Data backfill that depends on a newly-added enum value cannot run in the
      # same drizzle batch as the ALTER TYPE — Postgres rejects "unsafe use of
      # new value" in the same transaction. The ATM channel backfill is idempotent:
      # re-running after the first successful pass is a no-op. See #766 hotfix.
      - name: Run #766 ATM channel backfill
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$RELEASE_DIR'
            sudo -n -u findash /usr/local/bin/bun scripts/backfill-atm-channel.ts
          "

      # ---------------------------------------------------------------------
      # #799. Everything below this line is rollback-protected.
      #
      # `prev` MUST be captured before the first mutation, not inside the flip
      # step. The rollback step is gated on this output being non-empty, so
      # capturing it later would make rollback unreachable in the window where
      # the unit had already been replaced but the symlink had not — that is
      # the residual bug photo-showcase hit as its task #112 after doing the
      # same reorder. Capture first, mutate second.
      - name: Capture rollback state
        id: prevstate
        run: |
          set -eu
          PREV=$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "readlink '$APP_ROOT/app/current' 2>/dev/null || true")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "previous release: ${PREV:-<none>}"
          # Snapshot the live unit so rollback can restore it byte-for-byte.
          # Staged under the deploy-only dir, never /tmp — see #795.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            install -d -m 0700 /home/deploy/staging
            cp /etc/systemd/system/findash.service \
               /home/deploy/staging/findash.service.prev
          '

      - name: Install findash unit
        # Until #799 nothing re-installed this unit after bootstrap.sh laid it
        # down on a fresh droplet — CD only ever restarted the service. The
        # live copy drifted for months (it was still the 2026-04-18 file,
        # missing the TimeoutStopSec change from #185), and the #796 memory
        # caps had to be hand-placed, which meant the protection against a
        # global OOM was not reproducible from this repo.
        #
        # Runs BEFORE the symlink flip so the restart in that step picks up
        # the new unit, and so a bad unit fails the deploy while the previous
        # release is still serving.
        run: |
          set -eu
          STAGED=/home/deploy/staging/findash.service
          scp -i ~/.ssh/deploy_key \
            infra/systemd/findash.service "$DEPLOY_USER@$DEPLOY_HOST:$STAGED"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            STAGED=/home/deploy/staging/findash.service
            LIVE=/etc/systemd/system/findash.service
            # 0644 root:root, so the comparison needs no sudo grant.
            if cmp -s "$STAGED" "$LIVE"; then
              echo "findash unit already matches the repo — no-op"
            else
              echo "findash unit differs from the repo — installing"
              diff -u "$LIVE" "$STAGED" || true
              sudo -n install -m 0644 -o root -g root "$STAGED" "$LIVE"
              sudo -n systemctl daemon-reload
            fi
            # Drift gate. This is the part that matters: it converts silent
            # divergence into a red build instead of a surprise months later.
            if ! cmp -s "$STAGED" "$LIVE"; then
              echo "FATAL: installed unit does not match infra/systemd/findash.service"
              diff -u "$LIVE" "$STAGED" || true
              exit 1
            fi
            echo "unit verified byte-identical to the repo"
            # Surface the memory directives from #796 so a deploy log is
            # evidence they are actually in force, not merely committed.
            systemctl show findash.service -p MemoryHigh -p MemoryMax
          '

      - name: Flip symlink + restart findash
        id: flip
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            sudo -n -u findash ln -sfn '$APP_ROOT/app/releases/$GIT_SHA' '$APP_ROOT/app/current'
            sudo -n systemctl restart findash.service
          "

      - name: Health probe
        run: |
          set -eu
          for i in $(seq 1 15); do
            body=$(curl -fsS --max-time 5 "$APP_HEALTH_URL" 2>/dev/null || true)
            if echo "$body" | grep -q '"ok":true'; then
              echo "health OK on attempt $i"
              echo "$body"
              exit 0
            fi
            echo "health $i/15: not ready (body: ${body:-<empty>})"
            sleep 3
          done
          echo "health check failed after 15 attempts"
          exit 1

      - name: Rollback on failure
        # Gated on the capture step, NOT on the flip step (#799). Gating on
        # flip left the unit-install window unprotected: a failure after the
        # unit was replaced but before the symlink moved skipped rollback
        # entirely and left unit and release skewed.
        #
        # Restores the unit first, then the symlink, then restarts once — so
        # the single restart brings up the old release under the old unit.
        if: failure() && steps.prevstate.outputs.prev != ''
        env:
          PREV: ${{ steps.prevstate.outputs.prev }}
        run: |
          set -eu
          echo "rolling back to $PREV"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            PREV_UNIT=/home/deploy/staging/findash.service.prev
            LIVE=/etc/systemd/system/findash.service
            if [ -f \"\$PREV_UNIT\" ] && ! cmp -s \"\$PREV_UNIT\" \"\$LIVE\"; then
              echo 'restoring previous findash unit'
              sudo -n install -m 0644 -o root -g root \"\$PREV_UNIT\" \"\$LIVE\"
              sudo -n systemctl daemon-reload
            fi
            sudo -n -u findash ln -sfn '$PREV' '$APP_ROOT/app/current'
            sudo -n systemctl restart findash.service
          "

      - name: Prune old releases (keep 5)
        if: success()
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$APP_ROOT/app/releases'
            ls -1t | tail -n +6 | while read -r rel; do
              [ -n \"\$rel\" ] || continue
              sudo -n -u findash rm -rf \"\$rel\"
              echo \"pruned \$rel\"
            done
          "
